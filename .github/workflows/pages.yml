name: pages
# Démo de l'interface sur GitHub Pages (aucun serveur : rien n'est envoyé ; UI §14.3).
# Publiée seulement quand le workflow « ci » (tests Go, tests web, e2e, UI) a réussi sur main :
# workflow_run se déclenche à la fin de ci, jamais sur un push rouge (CLAUDE.md : le test « le
# serveur ne voit rien » bloque toute mise en ligne). workflow_dispatch : relance manuelle, sur la
# branche choisie (le déploiement vers l'environnement github-pages reste soumis à ses règles).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # Une ci verte, sur un push (jamais une pull request, même d'une branche nommée « main »).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      # Le commit exact que ci a validé, pas la pointe actuelle de main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Build de démo (UI §14.3) : faux serveur en mémoire, CSP meta, base /shhdrop/, 404.html.
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build:demo
        working-directory: web
      - run: node scripts/check-dist.mjs --demo
        working-directory: web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist-demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
