name: pages
# Démo de l'interface sur GitHub Pages (aucun serveur : rien n'est envoyé ; UI §14.3).
# Publiée seulement quand le workflow « ci » (tests Go, tests web, e2e, UI) a réussi sur main :
# workflow_run se déclenche à la fin de ci, jamais sur un push rouge (CLAUDE.md : le test « le
# serveur ne voit rien » bloque toute mise en ligne).
# Pas de workflow_dispatch (audit du 11 novembre) : il publiait n'importe quelle branche, sans ci
# verte. Pour republier : relancer le workflow « ci » du commit voulu de main (Re-run).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
# Une publication commencée va jusqu'au bout (une publication interrompue peut laisser Pages
# entre deux versions) ; la suivante attend son tour.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Une ci verte, sur un push de main (jamais une pull request, même d'une branche nommée « main »).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      # Le commit exact que ci a validé, pas la pointe actuelle de main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # Pas de cache npm (audit du 11 novembre) : ce job publie, et un cache est inscriptible par
      # tout code npm des jobs de ci (tests, Playwright) ; npm ci vérifie déjà chaque paquet
      # contre les empreintes du verrou, mais rien de ce qui est publié ne doit venir d'un cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      # Moteur WebAssembly (npm run build:demo commence par npm run build:engine).
      - uses: ./.github/actions/engine-toolchain
      # Build de démo (UI §14.3) : faux serveur en mémoire, CSP meta, base /shhdrop/, 404.html.
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build:demo
        working-directory: web
      - run: node scripts/check-dist.mjs --demo
        working-directory: web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist-demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
