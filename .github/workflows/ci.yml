name: ci
on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: cd server && go vet ./... && go test -race ./...
      - name: govulncheck
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --ignore-scripts && npm ci --ignore-scripts --prefix tools/svelte-check
      - run: cd web && npm test
      - run: cd web && npm run build
      # Le code de démo est absent de la production ; la démo porte ses protections (UI §14.3, A41).
      - run: cd web && node scripts/check-dist.mjs
      - run: cd web && npm run build:demo && node scripts/check-dist.mjs --demo
      - run: cd web && npm run check
      - name: npm audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
  e2e:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --ignore-scripts
      - run: make test-e2e
  ui:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --ignore-scripts
      - run: cd web && npx playwright install --with-deps chromium webkit
      - run: make test-ui
      - name: Captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-ui
          path: web/ui-e2e/__captures__/
          if-no-files-found: ignore
      - name: Traces et rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-ui
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
  # Build reproductible (spec §28.1) : sur deux machines différentes, deux builds chacun dans
  # deux dossiers différents ; les quatre doivent donner les mêmes empreintes. Obligatoire.
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --ignore-scripts
      - run: web/scripts/repro.sh "$RUNNER_TEMP/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.os }}
          path: ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
  repro-compare:
    needs: repro
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sums
      - name: Mêmes empreintes sur les deux machines
        run: |
          ls -R sums
          diff sums/sums-ubuntu-latest/SHA256SUMS sums/sums-ubuntu-24.04/SHA256SUMS
          echo "$(wc -l < sums/sums-ubuntu-latest/SHA256SUMS) fichiers identiques sur les deux machines"
