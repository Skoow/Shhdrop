name: ci
on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: cd server && go vet ./... && go test -race ./...
      - name: govulncheck
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  # Moteur Rust (engine/) : format, clippy (hôte et wasm32), tests, avis de sécurité RustSec.
  engine:
    runs-on: ubuntu-latest
    # Tests du moteur (Argon2id optimisé même en debug) et compilation de cargo-audit (≈ 2-3 min).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        uses: ./.github/actions/engine-toolchain
        with:
          wasm-bindgen: "false"
      # cargo fmt --check, cargo clippy -D warnings (hôte, puis shhdrop-wasm en wasm32), cargo test.
      - run: make test-engine
      # cargo-audit compilé ici, sans cache (même raison que wasm-bindgen : .github/actions/
      # engine-toolchain), par le Rust épinglé. --deny warnings : un avis « non maintenu »,
      # « unsound » ou une version retirée (yanked) échoue aussi.
      - name: cargo audit
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: |
          cargo +"$CHANNEL" install --locked --root "$RUNNER_TEMP/cargo-audit" cargo-audit --version 0.22.2
          cd engine && "$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --deny warnings
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/engine-toolchain
      - run: cd web && npm ci --ignore-scripts && npm ci --ignore-scripts --prefix tools/svelte-check
      - run: cd web && npm test
      - run: cd web && npm run build
      # Le code de démo est absent de la production ; la démo porte ses protections (UI §14.3, A41).
      - run: cd web && node scripts/check-dist.mjs
      - run: cd web && npm run build:demo && node scripts/check-dist.mjs --demo
      - run: cd web && npm run check
      - name: npm audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
  e2e:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/engine-toolchain
      - run: cd web && npm ci --ignore-scripts
      - run: make test-e2e
  ui:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/engine-toolchain
      - run: cd web && npm ci --ignore-scripts
      - run: cd web && npx playwright install --with-deps chromium webkit
      - run: make test-ui
      - name: Captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-ui
          path: web/ui-e2e/__captures__/
          if-no-files-found: ignore
      - name: Traces et rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-ui
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
  # Build reproductible (spec §28.1) : sur deux machines différentes, deux builds chacun dans
  # deux dossiers différents ; les quatre doivent donner les mêmes empreintes. Obligatoire.
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Deux builds du moteur en release (LTO), chacun dans son engine/target, plus wasm-bindgen-cli
    # à compiler (pas de cache : .github/actions/engine-toolchain).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/engine-toolchain
      - run: cd web && npm ci --ignore-scripts
      - run: web/scripts/repro.sh "$RUNNER_TEMP/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.os }}
          path: ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
  repro-compare:
    needs: repro
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sums
      - name: Mêmes empreintes sur les deux machines
        run: |
          ls -R sums
          diff sums/sums-ubuntu-latest/SHA256SUMS sums/sums-ubuntu-24.04/SHA256SUMS
          echo "$(wc -l < sums/sums-ubuntu-latest/SHA256SUMS) fichiers identiques sur les deux machines"
  # Le pkg du moteur (.wasm et colle) construit par l'étape « engine » de deploy/Dockerfile, qui
  # répète les commandes de web/scripts/build-engine.mjs (pas de Node dans cette étape), doit être
  # identique, octet pour octet, à celui des builds de la CI (empreintes du job repro).
  repro-docker:
    needs: repro
    runs-on: ubuntu-latest
    # Image rust à télécharger, wasm-bindgen-cli à compiler, moteur en release.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sums-ubuntu-latest
          path: sums
      - name: pkg de l'image identique à celui de la CI
        run: |
          docker build -f deploy/Dockerfile --target engine-pkg --output "type=local,dest=$RUNNER_TEMP/image" .
          grep '  pkg/' sums/SHA256SUMS > "$RUNNER_TEMP/ci.sums"
          [ "$(wc -l < "$RUNNER_TEMP/ci.sums")" -eq 4 ] || { echo "4 fichiers pkg/ attendus dans SHA256SUMS" >&2; exit 1; }
          (cd "$RUNNER_TEMP/image" && find pkg -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/image.sums"
          diff "$RUNNER_TEMP/ci.sums" "$RUNNER_TEMP/image.sums"
          echo "pkg de l'image identique à celui de la CI :"; cat "$RUNNER_TEMP/image.sums"
