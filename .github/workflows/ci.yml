name: ci
on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: cd server && go vet ./... && go test -race ./...
      - name: govulncheck
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  # Moteur Rust (engine/) : format, clippy (hôte et wasm32), tests, avis de sécurité RustSec.
  engine:
    runs-on: ubuntu-latest
    # Tests du moteur (Argon2id optimisé même en debug) et compilation de cargo-audit (≈ 2-3 min).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/engine-toolchain
        with:
          wasm-bindgen: "false"
      # cargo fmt --check, cargo clippy -D warnings (hôte, puis shhdrop-wasm, shhdrop-salon et shhdrop-salon-wasm en wasm32), cargo test.
      - run: make test-engine
      # cargo-audit compilé ici, sans cache (même raison que wasm-bindgen : .github/actions/
      # engine-toolchain), par le Rust épinglé. --deny warnings : un avis « non maintenu »,
      # « unsound » ou une version retirée (yanked) échoue aussi. Si un avis tombe : mettre à jour
      # la dépendance (cargo update -p <crate>, tests). Sans correctif publié, l'ignorer exige une
      # décision du propriétaire, notée dans engine/.cargo/audit.toml ([advisories] ignore =
      # ["RUSTSEC-…"], avec la raison et une date de réexamen) ; jamais d'ignore silencieux.
      - name: cargo audit
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: |
          cargo +"$CHANNEL" install --locked --root "$RUNNER_TEMP/cargo-audit" cargo-audit --version 0.23.0
          cd engine && "$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --deny warnings
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/engine-toolchain
      # svelte-check installé dans son propre dossier (et non par --prefix depuis web/ : le 11 novembre,
      # la CI y a lu les dépendances de web/ et refusé typescript 7, ERESOLVE).
      - run: cd web && npm ci --ignore-scripts
      - run: cd web/tools/svelte-check && npm ci --ignore-scripts
      - run: cd web && npm test
      - run: cd web && npm run build
      # Le code de démo est absent de la production ; la démo porte ses protections (UI §14.3, A41).
      - run: cd web && node scripts/check-dist.mjs
      - run: cd web && npm run build:demo && node scripts/check-dist.mjs --demo
      - run: cd web && npm run check
      # Toutes les dépendances, outils de build et de test compris (audit du 11 novembre, M11) :
      # Vite, Vitest, Playwright, svelte-check tournent dans la CI et produisent le site. Cet
      # audit contient celui des seules dépendances d'exécution (--omit=dev), au même niveau.
      - name: npm audit
        working-directory: web
        run: |
          npm audit --audit-level=high
          cd tools/svelte-check && npm audit --audit-level=high
  e2e:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          # Pas de cache Go ici : ces jobs exécutent le code npm, qui pourrait l'empoisonner.
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/engine-toolchain
      - run: cd web && npm ci --ignore-scripts
      - run: make test-e2e
  ui:
    needs: [go, web]
    runs-on: ubuntu-latest
    # ≈ 1 h 30 normalement ; un blocage échoue au bout de 2 h 30 au lieu de 6 h.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          # Pas de cache Go ici : ces jobs exécutent le code npm, qui pourrait l'empoisonner.
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/engine-toolchain
      - run: cd web && npm ci --ignore-scripts
      - run: cd web && npx playwright install --with-deps chromium webkit
        # Miroir apt bloqué (11 novembre : 2 h d'attente) : échec rapide plutôt que blocage.
        timeout-minutes: 15
      - run: make test-ui
      - name: Captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-ui
          path: web/ui-e2e/__captures__/
          if-no-files-found: ignore
      - name: Traces et rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-ui
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
  # Build reproductible (spec §28.1) : sur deux machines différentes, deux builds chacun dans
  # deux dossiers différents ; les quatre doivent donner les mêmes empreintes. Obligatoire.
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Deux builds du moteur en release (LTO), chacun dans son engine/target, plus wasm-bindgen-cli
    # à compiler (pas de cache : .github/actions/engine-toolchain).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/engine-toolchain
      - run: cd web && npm ci --ignore-scripts
      - run: web/scripts/repro.sh "$RUNNER_TEMP/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.os }}
          path: ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
  repro-compare:
    needs: repro
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sums
      - name: Mêmes empreintes sur les deux machines
        run: |
          ls -R sums
          diff sums/sums-ubuntu-latest/SHA256SUMS sums/sums-ubuntu-24.04/SHA256SUMS
          echo "$(wc -l < sums/sums-ubuntu-latest/SHA256SUMS) fichiers identiques sur les deux machines"
  # L'image de production, construite par deploy/Dockerfile avec le même SHH_BUILD_ID que la CI :
  # - son pkg du moteur (.wasm et colle ; étape « engine », qui répète les commandes de
  #   web/scripts/build-engine.mjs, sans Node) et tout son site (étape « web », dist/ entier)
  #   doivent être identiques, octet pour octet, à ceux des builds de la CI (SHA256SUMS du job
  #   repro) : sinon le site servi ne serait pas le build public vérifiable (spec §28, audit I6) ;
  # - l'image complète, puis le test du proxy (deploy/test-proxy.sh) avec ses deux binaires, son
  #   site et le binaire Caddy de l'image épinglée dans deploy/compose.yaml (audit M9).
  repro-docker:
    needs: repro
    runs-on: ubuntu-latest
    # Image rust à télécharger, wasm-bindgen-cli à compiler, moteur en release, puis le site.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sums-ubuntu-latest
          path: sums
      # Même valeur que repro.sh (git rev-parse --short=7 HEAD) : même pied de page, mêmes octets.
      - name: Identifiant de build
        run: echo "SHH_BUILD_ID=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - name: pkg et site de l'image identiques à ceux de la CI
        run: |
          docker build -f deploy/Dockerfile --build-arg SHH_BUILD_ID --target engine-pkg --output "type=local,dest=$RUNNER_TEMP/image" .
          docker build -f deploy/Dockerfile --build-arg SHH_BUILD_ID --target web-dist --output "type=local,dest=$RUNNER_TEMP/image" .
          # SHA256SUMS : « ./… » pour dist/, « pkg/… » pour le moteur (web/scripts/repro.sh).
          grep '  \./' sums/SHA256SUMS > "$RUNNER_TEMP/ci-dist.sums" || true
          grep '  pkg/' sums/SHA256SUMS > "$RUNNER_TEMP/ci-pkg.sums" || true
          # Liste vide = rien à comparer : échec. Le diff compare ensuite les listes entières
          # (un fichier en plus ou en moins dans l'image échoue aussi).
          [ -s "$RUNNER_TEMP/ci-dist.sums" ] || { echo "aucun fichier de dist/ dans SHA256SUMS" >&2; exit 1; }
          [ -s "$RUNNER_TEMP/ci-pkg.sums" ] || { echo "aucun fichier pkg/ dans SHA256SUMS" >&2; exit 1; }
          (cd "$RUNNER_TEMP/image/dist" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/image-dist.sums"
          (cd "$RUNNER_TEMP/image" && find pkg -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/image-pkg.sums"
          diff "$RUNNER_TEMP/ci-pkg.sums" "$RUNNER_TEMP/image-pkg.sums"
          diff "$RUNNER_TEMP/ci-dist.sums" "$RUNNER_TEMP/image-dist.sums"
          echo "image identique à la CI : $(wc -l < "$RUNNER_TEMP/image-pkg.sums") fichiers pkg/, $(wc -l < "$RUNNER_TEMP/image-dist.sums") fichiers dist/"
      - name: Image complète
        run: docker build -f deploy/Dockerfile --build-arg SHH_BUILD_ID -t shhdrop:ci .
      # Sans --build-arg SHH_BUILD_ID, l'image doit refuser de se construire (audit I6).
      - name: Image sans SHH_BUILD_ID refusée
        run: |
          if docker build -f deploy/Dockerfile --target web-dist --output "type=local,dest=$RUNNER_TEMP/sans-id" . > "$RUNNER_TEMP/sans-id.log" 2>&1; then
            echo "image construite sans SHH_BUILD_ID" >&2; exit 1
          fi
          grep -q 'SHH_BUILD_ID manquant' "$RUNNER_TEMP/sans-id.log" || { cat "$RUNNER_TEMP/sans-id.log" >&2; exit 1; }
      - name: Test du proxy avec l'image et le Caddy de compose.yaml
        run: |
          out="$RUNNER_TEMP/proxy"
          mkdir -p "$out"
          id=$(docker create shhdrop:ci)
          docker cp "$id:/shhdrop" "$out/shhdrop"
          docker cp "$id:/shhcheck" "$out/shhcheck"
          docker cp "$id:/site" "$out/site"
          docker rm "$id"
          caddy_image=$(grep -oE 'caddy:[0-9][^ ]*@sha256:[0-9a-f]{64}' deploy/compose.yaml)
          [ "$(printf '%s\n' "$caddy_image" | wc -l)" = 1 ] || { echo "image caddy introuvable dans compose.yaml" >&2; exit 1; }
          id=$(docker create "$caddy_image")
          docker cp "$id:/usr/bin/caddy" "$out/caddy"
          docker rm "$id"
          CADDY="$out/caddy" SHHDROP_BIN="$out/shhdrop" SHHCHECK_BIN="$out/shhcheck" STATIC_DIR="$out/site" deploy/test-proxy.sh
  # Scripts de déploiement et de build (audit M9) : ShellCheck épinglé (archive vérifiée par son
  # empreinte), go vet du petit programme deploy/shhcheck.
  deploy-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: deploy/shhcheck/go.mod
          cache: false
      # ShellCheck 0.11.0, publié le 4 août 2025 ; empreinte relevée le 11 novembre 2026 (le
      # binaire extrait est identique à celui d'une installation indépendante).
      - name: ShellCheck 0.11.0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: make lint-deploy
