version: 2
updates:
  # cooldown : une version n'est proposée que 7 jours après sa publication, le temps que
  # les paquets piégés soient repérés et retirés (audit du 5 novembre, M2). Les mises à
  # jour de sécurité de Dependabot n'attendent pas.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Outil de vérification des composants Svelte (npm run check), verrou à part (M10).
  - package-ecosystem: npm
    directory: /web/tools/svelte-check
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Moteur Rust (engine/Cargo.lock). wasm-bindgen, js-sys et wasm-bindgen-futures sont publiés
  # ensemble et épinglés par « = » : une seule proposition pour les trois. Une montée de
  # wasm-bindgen demande aussi de changer la version de wasm-bindgen-cli (0.2.130) dans
  # .github/actions/engine-toolchain, web/scripts/build-engine.mjs et deploy/Dockerfile : sans
  # cela, wasm-bindgen refuse le .wasm (versions différentes) et la CI échoue.
  # Le build utilise l'option expérimentale --experimental-reset-state-function de
  # wasm-bindgen-cli (web/scripts/build-engine.mjs : instance neuve après une panique). À chaque
  # montée de version, vérifier qu'elle existe encore et que la reprise après panique marche
  # (tests de panique du moteur : web/src/engine/index.test.ts).
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      wasm-bindgen:
        patterns: ["wasm-bindgen", "wasm-bindgen-futures", "js-sys"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Images de base de deploy/Dockerfile (étiquette ET empreinte, M10). Chaque image doit rester
  # alignée sur sa source de vérité, sinon le build ou la comparaison avec la CI échoue (job
  # repro-docker) : rust = engine/rust-toolchain.toml, node = web/.node-version, golang ≥
  # « toolchain » de server/go.mod et deploy/shhcheck/go.mod. Une proposition qui ne change que
  # l'image se complète à la main avant fusion.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Image de Caddy de deploy/compose.yaml (2.10 au minimum). Avant fusion : relancer
  # deploy/test-proxy.sh avec ce binaire (la CI le fait, job repro-docker).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
