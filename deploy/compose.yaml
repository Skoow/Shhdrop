# Pile de production de Shhdrop : Caddy (TLS) devant le serveur Go (spec §6, §15, §22, §36).
# Lancée par deploy.sh, qui fournit les variables depuis deploy/.env et l'empreinte de l'image.
#
# Variables obligatoires :
#   SHH_IMAGE      image du serveur, épinglée par empreinte : dépôt@sha256:…
#   SHH_DOMAIN     nom du site (exemple : shhgone.com)
#   SHH_DATA_ROOT  point de montage du volume chiffré (LUKS2, noatime), par exemple /srv/shhdrop.
#                  Doit contenir « data » (compte 65532, mode 0700) et « caddy » (root, 0700).
# Variables facultatives :
#   SHH_STORAGE_MAX  plafond de stockage en octets (défaut : 200 Gio, spec §24)
#   SHH_UPLOADS_MAX, SHH_DOWNLOADS_MAX, SHH_WATCH_MAX, SHH_WS_MAX, SHH_DISK_OPS_MAX : capacité
#                    (défaut : calculée d'après GOMEMLIMIT et nofile, README §11)
#   SHH_SALONS_MAX   salons vivants au plus (défaut : 200 ; 50 proposé pour un usage personnel),
#                    sans effet tant que le salon est désactivé (SHH_SALONS, ci-dessous)
#
# Réseau : Caddy utilise le réseau de la machine (il voit donc toujours la vraie adresse
# du client, en IPv4 comme en IPv6, sans dépendre de la traduction d'adresses de Docker).
# Le serveur Go est sur un réseau Docker interne, sans route vers Internet et sans port
# publié : seul Caddy, depuis la machine, peut le joindre.

name: shhdrop

services:
  shhdrop:
    image: ${SHH_IMAGE:?SHH_IMAGE manquant (dépôt@sha256:…)}
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Pas de vidage mémoire (spec §22) : il contiendrait des adresses et des jetons.
    ulimits:
      core: 0
      # Descripteurs : explicites, pour que les places calculées (au plus nofile / 8 par
      # catégorie, config/capacity.go) ne dépendent pas du réglage de Docker sur la machine.
      nofile: 65536
    # Fils du système (audit du 13 novembre, D4) : Go crée un fil par appel système bloquant
    # (lecture, écriture, fsync, SQLite). 256 pouvait être atteint sous un disque lent, et le
    # processus s'arrêtait net (« failed to create new OS thread »). 1 024, et les appels de
    # fichiers sont bornés à SHH_DISK_OPS_MAX (64) par le serveur.
    pids_limit: 1024
    # Plafonds (audit du 11 novembre) : un abus ou une fuite de mémoire ne fait pas tomber la
    # machine (sshd, Caddy, déverrouillage du volume). Pire cas avec les places calculées
    # d'après GOMEMLIMIT (README §11) : 67 envois simultanés gardés en mémoire (≤ 4 Mio
    # chacun) = 268 Mio, plus 360 téléchargements avec un tampon de 256 Kio chacun = 90 Mio,
    # soit 358 Mio de données vivantes ; le ramasse-miettes de Go peut doubler le tas
    # (GOGC=100) : ≈ 716 Mio, plus SQLite et le reste du serveur. 1 Gio laisse de la marge ; GOMEMLIMIT (un peu en dessous) fait
    # travailler le ramasse-miettes avant que le noyau ne tue le processus. Au-delà de 1 Gio :
    # arrêt brutal, puis redémarrage automatique (envois en cours perdus, comme tout redémarrage).
    # CPU : 1,5 processeur (Go règle GOMAXPROCS d'après cette limite) ; il faut donc au moins
    # 2 processeurs sur la machine, sinon Docker refuse de démarrer le conteneur (README, §1).
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    environment:
      GOMEMLIMIT: 900MiB
      SHH_DATA_DIR: /data
      SHH_STATIC_DIR: /site
      # Toutes les interfaces DU CONTENEUR (réseau interne + sa boucle locale, pour le
      # contrôle de santé). Accepté par le serveur parce que les deux lignes suivantes sont là.
      SHH_LISTEN: 0.0.0.0:8080
      # Échec fermé : sans X-Shh-Client-IP valide posé par Caddy, /api répond 500.
      SHH_BEHIND_PROXY: "1"
      # Seul pair de confiance : la passerelle du réseau interne, c'est-à-dire la machine,
      # où Caddy écoute. /32 : le serveur ne croit X-Shh-Client-IP de personne d'autre.
      SHH_TRUSTED_PROXY: 172.30.53.1/32
      SHH_STORAGE_MAX: ${SHH_STORAGE_MAX:-214748364800}
      # Salon (spec §39, plan C-2) : DÉSACTIVÉ, sans variable pour l'ouvrir, tant que le juriste
      # n'a pas validé l'hébergement des conversations (Q-SAL8, §39.7) : aucune route
      # /api/salons/*. Pour l'activer plus tard : "1", en changeant ce fichier (relu, commité).
      SHH_SALONS: "0"
      # Origine publique du site, comparée à l'en-tête Origin du WebSocket et copiée dans la CSP.
      # Vérifiée même salon coupé : une valeur refusée (majuscules dans SHH_DOMAIN, par exemple)
      # empêche le serveur de démarrer ET « shhdrop admin » de tourner (deploy/README.md §10).
      SHH_ORIGIN: https://${SHH_DOMAIN:?SHH_DOMAIN manquant (nom du site)}
      SHH_SALONS_MAX: ${SHH_SALONS_MAX:-200}
      # Capacité (README §11) : vide = calculée au démarrage d'après GOMEMLIMIT et nofile.
      SHH_UPLOADS_MAX: ${SHH_UPLOADS_MAX:-}
      SHH_DOWNLOADS_MAX: ${SHH_DOWNLOADS_MAX:-}
      SHH_WATCH_MAX: ${SHH_WATCH_MAX:-}
      SHH_WS_MAX: ${SHH_WS_MAX:-}
      SHH_DISK_OPS_MAX: ${SHH_DISK_OPS_MAX:-}
      # Limite anti-abus par personne, réglable : segments par minute et par connexion (1 500).
      SHH_SEGMENTS_PER_MIN: ${SHH_SEGMENTS_PER_MIN:-}
      # Trames non volatiles rangées au plus par salon (100 000 ≈ 417 Mo de disque).
      SHH_SALON_FRAMES_MAX: ${SHH_SALON_FRAMES_MAX:-}
    networks:
      interne:
        ipv4_address: 172.30.53.2
    volumes:
      # Sous-dossier du volume chiffré, jamais créé par Docker : si le volume n'est pas
      # déverrouillé et monté, le conteneur ne démarre pas, au lieu d'écrire sur le disque
      # système en clair (spec §22).
      - type: bind
        source: ${SHH_DATA_ROOT:?SHH_DATA_ROOT manquant (point de montage du volume chiffré)}/data
        target: /data
        bind:
          create_host_path: false
    # Fichiers temporaires éventuels : en mémoire, jamais sur disque.
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    # Aucun journal de conteneur sur disque (audit de confidentialité P6, spec §36 S1).
    # Pour lire un message de démarrage : « deploy.sh diagnose » (premier plan, rien d'écrit).
    logging:
      driver: none
    # Le serveur laisse 30 s aux transferts en cours avant de s'arrêter.
    stop_grace_period: 40s
    healthcheck:
      # /healthz ne répond qu'à la boucle locale du conteneur, sans passer par Caddy (spec §8).
      test: ["CMD", "/shhcheck", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  caddy:
    # Caddy 2.11.9 officiel (2.10 au minimum pour x25519mlkem768), épinglé par empreinte,
    # relevée le 10 novembre 2026. Changer l'étiquette ET l'empreinte ensemble, puis
    # relancer deploy/test-proxy.sh avec ce binaire.
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    # Réseau de la machine : Caddy écoute directement sur 80/tcp, 443/tcp et 443/udp (HTTP/3,
    # QUIC, décision du 13 novembre). Aucune ligne « ports: » : Docker l'ignore avec
    # network_mode: host (rien n'est publié ni traduit). Le pare-feu de la machine doit laisser
    # passer 443/udp (README §1).
    network_mode: host
    read_only: true
    # root DANS le conteneur, mais sans aucune capacité sauf celle d'écouter sur 80 et 443.
    # Non root impossible avec cette image sous no-new-privileges (capacité de fichier « +p »
    # seulement, ignorée sous no-new-privileges) : README §9, audit du 13 novembre (D9).
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    pids_limit: 256
    # Caddy relaie les corps sans les garder en entier (tampons de quelques dizaines de Kio par
    # connexion) ; TLS 1.3 et HTTP/2 pour quelques centaines de connexions tiennent dans
    # 256 Mio. 1 processeur : AES-GCM (instructions AES du processeur) chiffre plusieurs Gio/s par
    # cœur, bien plus que le lien réseau d'un serveur loué.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    environment:
      SHH_DOMAIN: ${SHH_DOMAIN:?SHH_DOMAIN manquant (nom du site)}
      SHH_UPSTREAM: 172.30.53.2:8080
    # Empreinte du Caddyfile, calculée par deploy.sh : si le fichier change, le conteneur
    # est recréé (l'API d'administration est coupée, donc pas de « caddy reload »).
    labels:
      app.shhdrop.caddyfile: ${SHH_CADDYFILE_SHA256:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Clés et certificats TLS, compte ACME : sur le volume chiffré eux aussi.
      - type: bind
        source: ${SHH_DATA_ROOT:?SHH_DATA_ROOT manquant}/caddy
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /config:size=8m,mode=0700,noexec,nosuid,nodev
    logging:
      driver: none
    depends_on:
      - shhdrop

networks:
  interne:
    # Aucune sortie vers Internet depuis le serveur Go : il n'en a pas besoin.
    internal: true
    ipam:
      config:
        - subnet: 172.30.53.0/29
          gateway: 172.30.53.1
