<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0D12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shhgone" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link
      rel="preload"
      href="/src/assets/fonts/mona-sans-latin-standard-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- PWA installable (Task 26 avancée) : URL relatives dans le manifeste (base / ou /Shhdrop/). Aucun service worker ici (Tasks C1 à C4). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/ui/fonts.css" />
    <link rel="stylesheet" href="/src/ui/tokens.css" />
    <link rel="stylesheet" href="/src/ui/base.css" />
    <!-- Référencement (retours CLEAN2) : description par défaut ; app/seo.ts la met à jour par page,
         avec l'adresse canonique et « noindex » hors des pages publiques. Aucune balise og:* (UI §12). -->
    <meta
      name="description"
      content="Envoyez fichiers, photos, vidéos et notes chiffrés de bout en bout, sans compte, par un lien avec mot de passe qui s'autodétruit. Le serveur ne lit rien."
    />
    <title>Partage chiffré de bout en bout, sans compte · Shhgone</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Sans JavaScript (moteurs de recherche qui n'exécutent pas les scripts, navigateurs bridés) :
         ce que fait Shhgone, et pourquoi le site a besoin de JavaScript (chiffrement sur l'appareil). -->
    <noscript>
      <h1>Shhgone : partage chiffré de bout en bout, sans compte</h1>
      <p>Envoyez fichiers, photos, vidéos, notes et messages vocaux par un lien protégé par un mot de passe, qui s'autodétruit après un temps ou un nombre d'ouvertures choisis. Tout est chiffré sur votre appareil : le serveur ne peut rien lire.</p>
      <p>Le chiffrement se fait dans votre navigateur : activez JavaScript pour utiliser Shhgone.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
