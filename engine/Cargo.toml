# Espace de travail du moteur Shhdrop (spécification 2026-11-10-moteur-rust-1-chiffrement).
# shhdrop-core : moteur sans navigateur, horloge, fichiers ni réseau. Le crate WebAssembly
# shhdrop-wasm : liaison WebAssembly du site (wasm-bindgen), avec le fournisseur WebCrypto
# de web/src/engine/provider.ts.
[workspace]
members = ["core", "salon", "wasm"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "AGPL-3.0-only"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Pas de panic = "abort" : le déroulement par défaut est gardé pour les liaisons natives futures.

# Argon2id (64 Mio, 3 passes) en mode debug : plusieurs secondes par appel sans optimisation.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# AES-GCM du fournisseur natif et SHA-256 en mode debug : ≈ 2,5 Mio/s sans optimisation (le code
# générique d'aes-gcm est instancié dans shhdrop-core), trop lent pour les tests d'ouverture
# (vecteur de 9 Mio, 400 altérations). Les vérifications de débordement et les debug_assert!
# restent actives (overflow-checks et debug-assertions ne dépendent pas d'opt-level).
[profile.dev.package.shhdrop-core]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# OpenMLS (suite 0x0001) en mode debug : HPKE, X25519, Ed25519, AES-GCM et SHA-256 sans
# optimisation rendent les tests du salon (groupes de 10 membres) très lents. Les vérifications
# de débordement et les debug_assert! restent actives.
[profile.dev.package.openmls]
opt-level = 3
[profile.dev.package.openmls_rust_crypto]
opt-level = 3
[profile.dev.package.hpke-rs]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
