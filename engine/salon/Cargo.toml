[package]
name = "shhdrop-salon"
version = "0.1.0"
description = "Moteur du salon Shhdrop : clés, enveloppe de taille fixe, groupe MLS, formats des messages"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
shhdrop-core = { path = "../core" }
# XChaCha20-Poly1305 (RustCrypto), déjà dans l'arbre via hpke-rs-rust-crypto (0.10.1 : verrouillée
# et plus ancienne que 7 jours) ; aucune fonctionnalité utilisée : API « en place » sans alloc.
chacha20poly1305 = { version = "=0.10.1", default-features = false }
# OpenMLS épinglé (versions exactes) : suite 0x0001 seulement, fournisseur RustCrypto.
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
# Clé de rôle du créateur (spec salon v3 §15.2, 14 novembre) : paire Ed25519 tirée d'une graine
# (HKDF de S_gestion). Aucune crate nouvelle : ed25519-dalek 2.2.0 est déjà dans l'arbre et
# compilée (openmls_basic_credential signe avec elle) ; seule l'arête directe est ajoutée au
# Cargo.lock. Utilisée seulement pour `SigningKey::from_bytes` → clé publique (la signature reste
# celle d'OpenMLS, `SignatureKeyPair::from_raw`).
ed25519-dalek = { version = "=2.2.0", default-features = false }
zeroize = { version = "1.9", default-features = false, features = ["alloc", "derive"] }
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
# Texte du salon : graphèmes (UAX #29) et écritures (UAX #24). unicode-normalization 0.1.26 est
# déjà dans l'arbre via shhdrop-core. Versions publiées le 1er juin 2026 et le 2 novembre 2026
# (9 jours avant le 11 novembre : au-dessus du minimum de 7 jours).
unicode-segmentation = "=1.13.3"
unicode-script = "=0.5.9"
# Squelette UTS #39 (sosies entre écritures) pour la clé d'unicité des pseudonymes ; publiée le 2 novembre 2026.
unicode-security = "=0.1.3"
unicode-normalization = { version = "=0.1.26", default-features = false }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
# Nonces des trames et identifiants des messages : aléa du système (déjà dans l'arbre via OpenMLS,
# verrouillée, plus ancienne que 7 jours). En natif, aucune feature ; dans le navigateur, `wasm_js`.
getrandom = { version = "=0.4.3", default-features = false }

# Navigateur seulement : la feature `js` d'openmls et l'aléa de getrandom ne sont jamais activés
# en natif (vérifié par `cargo tree -e features`). getrandom 0.2 (rand_core 0.6) et 0.4
# (rand_core 0.10) coexistent dans l'arbre d'OpenMLS.
[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.2", features = ["js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "=0.4.3", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
