[package]
name = "shhdrop-salon-wasm"
version = "0.1.0"
description = "Liaison WebAssembly du moteur du salon Shhdrop pour le site (module à part du moteur des partages)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
shhdrop-core = { path = "../core" }
shhdrop-salon = { path = "../salon" }
# Mêmes versions exactes que shhdrop-wasm (wasm-bindgen-cli 0.2.130 exige wasm-bindgen 0.2.130).
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# Aléa (nonces des trames, identifiants des messages) : tiré par shhdrop-salon (getrandom, feature
# `wasm_js` sur wasm32 seulement, déclarée dans engine/salon/Cargo.toml).
