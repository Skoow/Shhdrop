[package]
name = "shhdrop-salon-wasm"
version = "0.1.0"
description = "Liaison WebAssembly du moteur du salon Shhdrop pour le site (module à part du moteur des partages)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
shhdrop-core = { path = "../core" }
shhdrop-salon = { path = "../salon" }
# Mêmes versions exactes que shhdrop-wasm (wasm-bindgen-cli 0.2.130 exige wasm-bindgen 0.2.130).
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# Nonce des trames (24 octets) : déjà dans l'arbre (OpenMLS, verrouillée, plus de 7 jours).
getrandom = { version = "=0.4.3", default-features = false }

# Navigateur seulement : crypto.getRandomValues (jamais activé en natif, comme dans shhdrop-salon).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", default-features = false, features = ["wasm_js"] }
