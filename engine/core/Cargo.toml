[package]
name = "shhdrop-core"
version = "0.1.0"
description = "Moteur de chiffrement et de format des partages Shhdrop (site, puis apps)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
# blake2 et hmac ne sont pas appelés directement : déclarés pour activer `zeroize` (états internes
# de BLAKE2b dans Argon2id, de HMAC dans HKDF, effacés à la destruction ; Cargo unifie les fonctions).
blake2 = { version = "0.11", default-features = false, features = ["zeroize"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
hkdf = "0.13"
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
# Lecture du manifeste (JSON) ; aucune dérivation serde : arbre `Value`, vérifié champ par champ.
# float_roundtrip : nombres arrondis au plus près, comme JSON.parse (sinon écart possible d’un ULP).
serde_json = { version = "1", features = ["float_roundtrip"] }
subtle = { version = "2.6", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

# Fournisseur natif (tests aujourd'hui, apps plus tard) : n'entre pas dans le .wasm du site.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"] }

[[bench]]
name = "argon2"
harness = false
